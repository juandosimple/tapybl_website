<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../assets/js/color-modes.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <title>Tandem Lab - Demo</title>
  <style>
    #drop-zone {
      width: 100%;
      height: 200px;
      border: 2px dashed #aaa;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s, border-color 0.3s;
      cursor: pointer;
    }

    #drop-zone.dragover {
      background-color: #e0f7fa;
      border-color: #00acc1;
      color: #007c91;
    }

    #file-info {
      margin-top: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #file-info p {
      margin: 5px 0;
    }

    /* Estilos para el loader */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00acc1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Eighth navbar example">
    <div class="container">
      <a class="navbar-brand" href="#">Container</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample07" aria-controls="navbarsExample07" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarsExample07">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-expanded="false">Theme</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#" data-bs-theme-value="light" aria-pressed="false">
                <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#sun-fill"></use></svg>
                Light
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
              </a></li>
              <li><a class="dropdown-item" href="#" data-bs-theme-value="dark" aria-pressed="false">
                <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>
                Dark
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
              </a></li>
              <li><a class="dropdown-item" href="#" data-bs-theme-value="auto" aria-pressed="true">
                <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#circle-half"></use></svg>
                Auto
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
              </a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- NAVIGATION -->


<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Upload new file
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Uploads your documents</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- UPLOAD ZONE -->
        <div id="drop-zone">Drag your file here or click</div>
        <input type="file" id="file-input" style="display: none;" />
        <div id="file-info"></div>
        <!-- UPLOAD ZONE -->
      </div>
    </div>
  </div>
</div>
