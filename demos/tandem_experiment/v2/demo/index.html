    <div class="container-fluid">
      <div class="row">
              <!-- FIRST COLUMN -->
      <div class="col-3" id="firstColumn">
          <div class="header">
            <h1>The Crown Tower</h1>
            <h2>22 Victoria Road, Westminster, London, SW1P 3AP</h2>
          </div>
        <!-- WIDGET -->
        <div class="widget" id="documentsList">
          <h4>Documents</h4>
          
          <!-- Preloader (hidden by default) -->
          <div id="preloader" style="display: none;"><div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div></div>
        
          <ul id="fileList">
            <!-- List of files will be displayed here -->
          </ul>
          
          <!-- Button trigger modal -->
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Upload new file
          </button>
        </div>


        <div class="widget" id="quakeWidget">
          <h4>Live tremor sensor</h4>
          <canvas id="quakeChart" width="300" height="200"></canvas>
          <div class="status" id="quakeStatus">Waiting data...</div>
          <div class="time" id="quakeTime">--:--</div>
        </div>
        
        <div class="widget" id="tempWidget">
          <h4>Building temperature sensor</h4>
          <div class="status"><span  id="tempStatus">--</span><span class="degrees">°</span></div>
          <div class="time" id="tempTime">--:--</div>
        </div>
        <!-- WIDGET -->
      </div>
      <!-- FIRST COLUMN -->

      <!-- SECOND COLUMN -->
       <div class="col-9">
        <div id="viewer"></div>
       </div>
      <!-- SECOND COLUMN -->
      </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Upload your documents</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- Select para elegir nivel -->
            <label for="level-select">Select Level:</label>
            <select id="level-select" class="form-select mb-3">
              <option value="level-0">Level 0</option>
              <option value="level-1">Level 1</option>
            </select>
    
            <!-- UPLOAD ZONE -->
            <div id="drop-zone" class="border p-3 text-center">
              Drag your file here or click
              <input type="file" id="file-input" class="d-none" />
            </div>
            <div id="file-info"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal -->
    <!-- Modal -->
     <!-- File Viewer Modal -->
    <!-- Modal para mostrar imágenes -->
    <div class="modal fade" id="fileModal" tabindex="-1" aria-labelledby="fileModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalFileTitle">Preview</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="modalFileImage" src="" class="img-fluid" alt="Preview" />
          </div>
        </div>
      </div>
    </div>
    <!-- Modal -->
