<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escaneo QR con Cámara Trasera - Depuración</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    video {
      width: 400px;
      height: 300px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Escaneo QR con Cámara Trasera</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  
  <!-- Cargamos jsQR -->
  <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
  
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Función para iniciar el stream de la cámara trasera
    function startScanning() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          video.srcObject = stream;
          video.play();
          console.log("Stream iniciado correctamente.");
          requestAnimationFrame(scanQR);
        })
        .catch(err => {
          console.error("Error al acceder a la cámara:", err);
          document.body.insertAdjacentHTML('beforeend', `<p style="color:red;">Error: ${err.message}</p>`);
        });
    }

    // Función que se ejecuta en cada frame para procesar la imagen y buscar el QR
    function scanQR() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Ajustamos el canvas a las dimensiones del video
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Log para verificar que se procesa el frame
        console.log("Procesando frame...");

        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            console.log("Código QR detectado:", code.data);
            // Aquí podrías redirigir o procesar el código QR
              window.location.href = 'ar.html?data=' + encodeURIComponent(code.data);
            return; // Detenemos el escaneo al detectar un QR
          }
        } catch (e) {
          console.error("Error al procesar el frame:", e);
        }
      }
      requestAnimationFrame(scanQR);
    }

    // Inicia el proceso cuando la ventana se carga
    window.onload = function() {
      startScanning();
    };
  </script>
</body>
</html>
